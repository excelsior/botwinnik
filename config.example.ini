; Botwinnik configuration.
; Copy this file to config.ini and fill in at least one API key.
; config.ini is git-ignored, so your keys stay out of the repository.
;
; effort sets how hard the models think, by the game's time category. Left
; empty, it is low for bullet, medium for blitz, high for rapid and max (the
; highest level the API has) for classical. One level applies to every game;
; four, comma-separated, set bullet, blitz, rapid and classical, e.g.
;   effort = low, low, medium, high
; "default" leaves a category to the model's own default. A model that doesn't
; take a level plays at the next lower one it does, or at its default.

[openai]
; ChatGPT models, through the OpenAI API (https://platform.openai.com/api-keys).
api_key =
; Models listed first in the game setup form, first one is the default. The
; form also offers every other model the key can use, fetched from the API.
; Any other model ID can still be typed in.
models = gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna
; Reasoning effort: none, minimal, low, medium, high, xhigh, max.
effort =

[anthropic]
; Claude models, through the Anthropic API (https://platform.claude.com/settings/keys).
api_key =
models = claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5, claude-fable-5-1
; Effort: low, medium, high, xhigh, max.
effort =

[google]
; Gemini models, through the Gemini API (https://aistudio.google.com/apikey).
api_key =
models = gemini-3.8-flash, gemini-3.1-pro-preview, gemini-2.5-pro, gemini-2.5-flash-lite
; Thinking level for Gemini 3 and later: minimal, low, medium, high, max.
; Gemini 2.5 models ignore it.
effort =

[xai]
; Grok models, through the xAI API (https://console.x.ai).
api_key =
models = grok-4.7, grok-4.6, grok-4.3
; Reasoning effort: low, medium, high, max.
effort =

[yandex]
; Alice AI and YandexGPT models, through Yandex AI Studio's OpenAI-compatible
; API. In the Yandex Cloud console (https://console.yandex.cloud), give a
; service account the ai.languageModels.user role and create an API key for
; it; the key's secret (AQVN...) goes in api_key.
api_key =
; The ID of the folder the service account is in (b1g...), where the models
; run and are billed.
folder_id =
; Model IDs as in the gpt://<folder_id>/<model> URIs, without the folder.
; The setup form also offers the folder's other text models (Qwen, GPT-OSS...).
models = aliceai-llm, aliceai-llm-flash, yandexgpt-5.1
; Reasoning effort, for the models that reason: low, medium, high, max.
effort =

[prices]
; USD per million tokens, used to work out what each move and game costs:
;   model = input, output[, cached input]
; Built-in prices (October 2026) cover the current Claude, GPT-5.6, Gemini
; and Grok models. The GPT-5.6 ones come from third-party listings, so check
; them against https://openai.com/api/pricing and override them here. Gemini
; 3.8 Flash's built-in price doubles on January 1, 2027, when its
; introductory price ends. Yandex's models have no built-in price; Yandex
; lists them per 1,000 tokens, so multiply its prices by 1,000
; (https://aistudio.yandex.ru/docs/en/ai-studio/pricing.html).
; Models without a price still have their tokens counted, but no cost.
; gpt-5.6-sol = 5, 30, 0.5
; claude-opus-5-5 = 4, 20
; gemini-2.5-flash = 0.3, 2.5, 0.03

[analysis]
; Stockfish analyzes every finished game for the players' accuracy, in the
; background. Left empty, engine is the bundled Stockfish 18 lite
; (WebAssembly, run with Node). Set it to any UCI engine instead, such as a
; native Stockfish, which is faster: a path (relative to this file) or a
; command on the PATH. "off" stops analyzing games.
engine =
; How many plies deep the engine searches each position. 18 takes the bundled
; engine about half a second a position.
depth = 18

[app]
; The admin page only listens on this machine unless you change host. In
; Docker (compose.yaml), the image sets these three instead.
host = 127.0.0.1
port = 3000
; Where games are saved, relative to this file.
games_dir = games
